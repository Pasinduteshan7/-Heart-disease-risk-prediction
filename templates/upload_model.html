<!DOCTYPE html>
<html>
<head>
    <title>Upload Model</title>
</head>
<body>
    <h1>Upload Model (.sav)</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: red;">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <form method="POST" enctype="multipart/form-data">
        <p>Select model file (.sav): <input type="file" name="model_file" accept=".sav" /></p>
        <p><input type="submit" value="Upload" /></p>
    </form>
    <p><a href="{{ url_for('index') }}">Back</a></p>
</body>
</html>
